name: Daily Scholarship & Schemes Scraper

# Schedule disabled: the GitHub account is billing-locked so scheduled runs
# fail before starting and spam failure emails. Scholarships are now served
# live from /api/scholarships (Vercel). Re-add the cron block below after the
# billing lock is resolved if committed snapshots are wanted again:
#   schedule:
#     - cron: '0 2 * * *'
on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Scraper Script
        run: node scripts/daily_scraper.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/scholarships.json
          git commit -m "Automated daily fetch of scholarships" || echo "No changes to commit"
          git push
