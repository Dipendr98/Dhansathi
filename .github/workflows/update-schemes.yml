name: Update government schemes

# Schedule disabled: the GitHub account is billing-locked so scheduled runs
# fail before starting and spam failure emails. The scheme feed is now served
# live (and edge-cached daily) from /api/schemes on Vercel. This workflow is
# kept only for manually regenerating the committed static snapshot.
# Re-add the cron block below after the billing lock is resolved:
#   schedule:
#     - cron: '30 2 * * *'
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schemes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh myScheme catalog
        run: npm run update:schemes
        env:
          MYSCHEME_API_KEY: ${{ secrets.MYSCHEME_API_KEY }}

      - name: Verify build
        run: npm run build

      - name: Commit updated scheme feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update government scheme feed'
          file_pattern: public/generated-government-schemes.json
